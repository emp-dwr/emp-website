name: Render PDFs

on:
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Report to render'
        required: true
        type: choice
        options:
          - all
          - cwq
          - dwq
          - benthic
          - phyto
          - zoop

      report_year:
        description: 'Report year'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pdfs
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::targets
            any::tarchetypes
            any::conflicted
            any::R6
            any::dplyr
            any::tidyr
            any::purrr
            any::tibble
            any::cowplot
            any::xml2
            any::ggplot2
            any::readr
            any::stringr
            any::forcats
            any::glue
            any::lubridate
            any::rlang
            any::here
            any::rprojroot
            any::scales
            any::colorspace
            any::RColorBrewer
            any::patchwork
            any::ggborderline
            any::treemapify
            any::knitr
            any::kableExtra
            any::openxlsx
            any::rvest
            any::jsonlite
            any::magrittr
            any::httr2
            any::yaml
          cache: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Cache targets store
        uses: actions/cache@v4
        with:
          path: _targets
          key: targets-${{ github.run_id }}
          restore-keys: targets-

      - name: Build data pipeline
        run: Rscript -e 'targets::tar_make()'

      - name: Render all pdfs
        if: ${{ github.event.inputs.report_type == 'all' }}
        run: quarto render pdfs -P report_year:${{ github.event.inputs.report_year }}

      - name: Render selected pdf
        if: ${{ github.event.inputs.report_type != 'all' }}
        run: |
          quarto render "pdfs/${{ github.event.inputs.report_type }}-report.qmd" \
            -P report_year:${{ github.event.inputs.report_year }}

      - name: Copy PDFs to archive
        run: |
          REPORT_YEAR="${{ github.event.inputs.report_year }}"

          if [ "${{ github.event.inputs.report_type }}" = "all" ]; then
            SECTIONS="cwq dwq benthic phyto zoop"
          else
            SECTIONS="${{ github.event.inputs.report_type }}"
          fi

          for sect in $SECTIONS; do
            SRC="pdfs/${sect}-report.pdf"
            DST="admin/archive/${sect}"
            if [ -f "$SRC" ]; then
              mkdir -p "$DST"
              cp "$SRC" "$DST/${sect}-report-${REPORT_YEAR}.pdf"
              echo "Archived $SRC -> $DST/${sect}-report-${REPORT_YEAR}.pdf"
            else
              echo "Warning: $SRC not found"
            fi
          done

      - name: Upload PDFs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: emp-reports-${{ github.event.inputs.report_year }}
          path: pdfs/*.pdf
          if-no-files-found: error

      - name: Commit figures and archived PDFs
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          if [ -d "admin/figures-tables" ]; then
            git add admin/figures-tables
          fi
          if [ -d "admin/archive" ]; then
            git add admin/archive
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "archive ${{ github.event.inputs.report_year }} pdfs"
            git push origin main
          fi