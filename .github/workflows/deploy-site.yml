name: Deploy Full Site

on:
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Report to update'
        required: true
        type: choice
        options:
          - all
          - cwq
          - dwq
          - benthic
          - phyto
          - zoop

      report_year:
        description: 'Report year for selected report'
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::targets
            any::tarchetypes
            any::conflicted
            any::R6
            any::dplyr
            any::tidyr
            any::purrr
            any::tibble
            any::cowplot
            any::xml2
            any::ggplot2
            any::readr
            any::stringr
            any::forcats
            any::glue
            any::lubridate
            any::rlang
            any::here
            any::rprojroot
            any::scales
            any::colorspace
            any::RColorBrewer
            any::patchwork
            any::ggborderline
            any::treemapify
            any::knitr
            any::kableExtra
            any::openxlsx
            any::rvest
            any::jsonlite
            any::plotly
            any::htmltools
            any::magrittr
            any::httr2
            any::yaml
          cache: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Cache targets store
        uses: actions/cache@v4
        with:
          path: _targets
          key: targets-${{ github.run_id }}
          restore-keys: targets-

      - name: Build data pipeline
        run: Rscript -e 'targets::tar_make()'

      - name: Remove freeze cache for full rebuild
        if: ${{ github.event.inputs.report_type == 'all' }}
        run: rm -rf website/_freeze

      - name: Render full site
        if: ${{ github.event.inputs.report_type == 'all' }}
        run: quarto render website -P report_year:${{ github.event.inputs.report_year }}

      - name: Render selected report page
        if: ${{ github.event.inputs.report_type != 'all' }}
        run: |
          REPORT_TYPE="${{ github.event.inputs.report_type }}"
          REPORT_YEAR="${{ github.event.inputs.report_year }}"

          case "$REPORT_TYPE" in
            cwq)
              REPORT_FILE="website/cwq/cwq-report.qmd"
              ;;
            dwq)
              REPORT_FILE="website/dwq/dwq-report.qmd"
              ;;
            benthic)
              REPORT_FILE="website/benthic/benthic-report.qmd"
              ;;
            phyto)
              REPORT_FILE="website/phyto/phyto-report.qmd"
              ;;
            zoop)
              REPORT_FILE="website/zoop/zoop-report.qmd"
              ;;
            *)
              echo "Unknown report type: $REPORT_TYPE"
              exit 1
              ;;
          esac

          quarto render "$REPORT_FILE" -P report_year:"$REPORT_YEAR"

      - name: Copy figures into site
        run: |
          Rscript -e 'source("admin/setup_scripts/00_global_scripts/01_general_copy.R"); copy_figures("website")'

      - name: Rebuild site with fresh figures
        run: quarto render website --profile freeze -P report_year:${{ github.event.inputs.report_year }}

      - name: Commit freeze cache and figures
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          if [ -d "website/_freeze" ]; then
            git add website/_freeze
          else
            echo "No freeze cache found; skipping."
          fi
          if [ -d "admin/figures-tables" ]; then
            git add admin/figures-tables
          else
            echo "No admin figures found; skipping."
          fi
          if [ -d "website/admin/figures-tables" ]; then
            git add website/admin/figures-tables
          else
            echo "No website figures found; skipping."
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m 'update freeze cache and figures'
            git push origin main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './website/_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4